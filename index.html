<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis proyectos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: #0a0a0b;
      color: #f4f4f5;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.5px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      width: min(640px, 100%);
    }

    a {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px;
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      border: 1px solid #26262b;
      transition: transform 0.2s, border-color 0.2s;
    }

    a:hover {
      transform: translateY(-4px);
      border-color: #71717a;
    }

    .music {
      background: linear-gradient(135deg, #14532d, #121214 70%);
    }

    .cafe {
      background: linear-gradient(135deg, #78350f, #121214 70%);
    }

    .basket {
      background: linear-gradient(135deg, #7c2d12, #121214 70%);
    }

    strong {
      font-size: 1.3rem;
    }

    span {
      color: #a1a1aa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Mis proyectos</h1>
  <div class="projects">
    <a class="music" href="spotify-api/index.html">
      <strong>Sonora</strong>
      <span>Página de música conectable a la API de Spotify</span>
    </a>
    <a class="cafe" href="cafe/index.html">
      <strong>Café Aurora</strong>
      <span>Sitio web de una cafetería: menú, horario, ubicación y contacto</span>
    </a>
    <a class="basket" href="basketball/index.html">
      <strong>Hoops Data</strong>
      <span>Jugadores de baloncesto, trofeos e imágenes</span>
    </a>
  </div>
</body>
</html>
